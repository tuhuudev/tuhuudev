# Build check cho portfolio tren PR (deploy-portfolio.yml chi chay tren main).
name: Portfolio CI

on:
  pull_request:
    paths: ['portfolio/**', 'README.md', '.github/workflows/portfolio-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - run: npm ci
        working-directory: portfolio
      - run: npm run check:readme
        working-directory: portfolio
      - run: npm run build
        working-directory: portfolio
      - run: npm run check:size
        working-directory: portfolio
      - run: npx playwright install --with-deps chromium
        working-directory: portfolio
      - run: npx playwright test
        working-directory: portfolio
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: portfolio/test-results
          retention-days: 7
